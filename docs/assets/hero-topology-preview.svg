<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="AppFlow Profiler — Real-Time Application Network Topology and Bottleneck Advisor Preview">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e293b"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="560" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="560" rx="16" fill="url(#grid)" opacity="0.7"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="52" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="26" r="6" fill="#38bdf8"/>
  <text x="44" y="31" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">AppFlow Profiler</text>
  <rect x="205" y="15" width="96" height="22" rx="6" fill="#0ea5e9" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="220" y="30" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">SIMULATION</text>
  <circle cx="1068" cy="26" r="5" fill="#22c55e"/>
  <text x="1080" y="30" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12">CONNECTED · 1 Hz</text>

  <!-- KPI Strip (5 Cards) -->
  <g transform="translate(24, 68)">
    <rect x="0" y="0" width="220" height="64" rx="10" fill="#111827" stroke="#1e293b"/>
    <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Fleet Entities</text>
    <text x="16" y="48" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="18" font-weight="700">53 <tspan fill="#64748b" font-size="12" font-weight="400">/ 17 edges</tspan></text>

    <rect x="232" y="0" width="220" height="64" rx="10" fill="#111827" stroke="#1e293b"/>
    <text x="248" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Throughput</text>
    <text x="248" y="48" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="18" font-weight="700">1.7k rps</text>

    <rect x="464" y="0" width="220" height="64" rx="10" fill="#111827" stroke="#1e293b"/>
    <text x="480" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Global p99</text>
    <text x="480" y="48" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="18" font-weight="700">142 ms</text>

    <rect x="696" y="0" width="220" height="64" rx="10" fill="#111827" stroke="#1e293b"/>
    <text x="712" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Error Rate</text>
    <text x="712" y="48" fill="#22c55e" font-family="ui-monospace, monospace" font-size="18" font-weight="700">0.2%</text>

    <rect x="928" y="0" width="224" height="64" rx="10" fill="#111827" stroke="#1e293b"/>
    <text x="944" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Status</text>
    <text x="944" y="48" fill="#ef4444" font-family="ui-monospace, monospace" font-size="15" font-weight="700">1 Critical <tspan fill="#64748b" font-size="11">(db-pool)</tspan></text>
  </g>

  <!-- Directed Edges -->
  <g stroke-width="2.5" fill="none">
    <path d="M 210 265 C 265 265, 275 215, 330 215" stroke="#22c55e"/>
    <path d="M 210 265 C 265 265, 275 335, 330 335" stroke="#f59e0b"/>
    <path d="M 510 215 C 565 215, 575 215, 630 215" stroke="#22c55e"/>
    <path d="M 510 335 C 565 335, 575 335, 630 335" stroke="#ef4444" stroke-dasharray="6 4"/>
  </g>

  <!-- Node 1: edge-LB -->
  <g transform="translate(40, 225)">
    <rect width="170" height="80" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="14" y="26" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">edge-lb</text>
    <text x="14" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">420 rps · p99 8ms</text>
    <text x="14" y="64" fill="#22c55e" font-family="ui-monospace, monospace" font-size="10">● HEALTHY · sat 24%</text>
  </g>

  <!-- Node 2: api-gateway -->
  <g transform="translate(330, 175)">
    <rect width="180" height="80" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="14" y="26" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">api-gateway</text>
    <text x="14" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">395 rps · p99 19ms</text>
    <text x="14" y="64" fill="#22c55e" font-family="ui-monospace, monospace" font-size="10">● HEALTHY · sat 38%</text>
  </g>

  <!-- Node 3: checkout-svc -->
  <g transform="translate(330, 295)">
    <rect width="180" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="14" y="26" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">checkout-svc</text>
    <text x="14" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">180 rps · p99 412ms</text>
    <text x="14" y="64" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="10">▲ DEGRADED · sat 82%</text>
  </g>

  <!-- Node 4: redis-cache -->
  <g transform="translate(630, 175)">
    <rect width="180" height="80" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="14" y="26" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">redis-cache</text>
    <text x="14" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">310 rps · p99 2ms</text>
    <text x="14" y="64" fill="#22c55e" font-family="ui-monospace, monospace" font-size="10">● HEALTHY · sat 19%</text>
  </g>

  <!-- Node 5: postgres-primary -->
  <g transform="translate(630, 295)">
    <rect width="180" height="80" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="14" y="26" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">postgres-primary</text>
    <text x="14" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">165 rps · p99 940ms</text>
    <text x="14" y="64" fill="#ef4444" font-family="ui-monospace, monospace" font-size="10">◆ CRITICAL · sat 96%</text>
  </g>

  <!-- Progressive Disclosure Detail Sheet Preview -->
  <g transform="translate(848, 152)">
    <rect width="328" height="380" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="14" font-weight="700">svc:postgres-primary</text>
    <text x="20" y="52" fill="#ef4444" font-family="ui-monospace, monospace" font-size="11">CRITICAL · M/M/c Pool Exhaustion</text>
    <line x1="20" y1="66" x2="308" y2="66" stroke="#1e293b"/>
    <text x="20" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">p99 Latency (120-Tick Ring Buffer)</text>
    <polyline points="20,145 55,142 90,140 125,135 160,120 195,98 230,92 265,86 305,82" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <text x="20" y="178" fill="#94a3b8" font-family="sans-serif" font-size="11">TCP Socket State Breakdown</text>
    <rect x="20" y="190" width="190" height="12" rx="4" fill="#22c55e"/>
    <rect x="214" y="190" width="94" height="12" rx="4" fill="#ef4444"/>
    <text x="20" y="220" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">ESTABLISHED: 48 · CLOSE_WAIT: 24</text>
    <rect x="20" y="246" width="288" height="110" rx="8" fill="#111827" stroke="#1e293b"/>
    <text x="32" y="270" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AI / SRE Advisor Insight</text>
    <text x="32" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="11">PgBouncer transaction pooling +</text>
    <text x="32" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11">circuit-breaker timeout tuning on</text>
    <text x="32" y="328" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">[svc:checkout-svc] → [svc:postgres-primary]</text>
  </g>
</svg>
